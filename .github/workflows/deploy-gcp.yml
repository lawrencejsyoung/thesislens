name: Deploy to GCP Cloud Run

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'northamerica-northeast1' }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'thesislens' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'thesislens' }}

jobs:
  verify:
    name: Pre-Deploy Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Verification Suite
        run: |
          npm run typecheck
          npm run verify:quant
          npm run verify:mcp
          npm run verify:security

  build-and-deploy:
    name: Build, Scan & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [verify]
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GCP configuration
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ] || [ -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Missing required GitHub repository variables: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT. See docs/GCP_DEPLOYMENT.md."
            exit 1
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: docker build -t "$IMAGE_URI" .

      - name: Scan container image with Trivy before push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push immutable image to Artifact Registry
        id: push
        env:
          IMAGE_BASE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}
        run: |
          docker push "${IMAGE_BASE}:${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_BASE}:${{ github.sha }}")
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.push.outputs.image_digest }}
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=1Gi
            --concurrency=40
            --min-instances=0
            --max-instances=10
            --timeout=120
            --ingress=all
            --set-env-vars=NODE_ENV=production,GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }},ALLOW_CLIENT_API_KEY_OVERRIDE=${{ vars.ALLOW_CLIENT_API_KEY_OVERRIDE || 'true' }}
            --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,MCP_API_KEY=MCP_API_KEY:latest

      - name: Post-deploy health check smoke test
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Verifying deployed service at ${SERVICE_URL}/api/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "${SERVICE_URL}/api/health" | grep -q '"ok":true'
          echo "Health check passed!"
